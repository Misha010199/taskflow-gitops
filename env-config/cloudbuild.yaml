steps:
  # Build backend
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "asia-south1-docker.pkg.dev/$PROJECT_ID/task-repo/backend:latest",
        "./app-code/backend",
      ]

  # Build frontend
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "asia-south1-docker.pkg.dev/$PROJECT_ID/task-repo/frontend:latest",
        "./app-code/frontend",
      ]

  # Push backend
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "asia-south1-docker.pkg.dev/$PROJECT_ID/task-repo/backend:latest",
      ]

  # Push frontend
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "asia-south1-docker.pkg.dev/$PROJECT_ID/task-repo/frontend:latest",
      ]

  # Deploy to Kubernetes
  - name: "gcr.io/cloud-builders/kubectl"
    args: ["apply", "-f", "env-config/"]
    env:
      - "CLOUDSDK_COMPUTE_REGION=asia-south1"
      - "CLOUDSDK_CONTAINER_CLUSTER=task-cluster"
