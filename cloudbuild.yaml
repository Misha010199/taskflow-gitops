steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "asia-south1-docker.pkg.dev/$PROJECT_ID/task-repo/backend:latest",
        "./app-code/backend",
      ]

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--no-cache",
        "-t",
        "asia-south1-docker.pkg.dev/$PROJECT_ID/task-repo/frontend:latest",
        "./app-code/frontend",
      ]

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "asia-south1-docker.pkg.dev/$PROJECT_ID/task-repo/backend:latest",
      ]

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "asia-south1-docker.pkg.dev/$PROJECT_ID/task-repo/frontend:latest",
      ]

  - name: "gcr.io/cloud-builders/kubectl"
    args: ["apply", "-f", "env-config/"]
    env:
      - "CLOUDSDK_COMPUTE_REGION=asia-south1"
      - "CLOUDSDK_CONTAINER_CLUSTER=cluster-1"

  - name: "gcr.io/cloud-builders/kubectl"
    args: ["rollout", "restart", "deployment/frontend"]
    env:
      - "CLOUDSDK_COMPUTE_REGION=asia-south1"
      - "CLOUDSDK_CONTAINER_CLUSTER=cluster-1"

options:
  logging: CLOUD_LOGGING_ONLY
